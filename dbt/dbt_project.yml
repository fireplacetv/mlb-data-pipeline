name: "mlb"
version: "1.0.0"
config-version: 2

profile: "mlb"
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "logs"

# Outside the bind-mounted repo, so the packages installed at image build stay visible (§9).
packages-install-path: /opt/dbt_packages

models:
  mlb:
    staging:
      +materialized: table
      +schema: staging

flags:
  # No anonymous usage telemetry: keeps builds off the network.
  send_anonymous_usage_stats: false

vars:
  # Recency tests on completed loads; turn on in season: --vars '{check_freshness: true}'
  check_freshness: false
