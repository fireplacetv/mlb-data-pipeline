name: Scheduled ingest

# Daily production run (docs/roadmap/phase-2-cloud-and-scale.md, P2M2): catch up both
# pipelines against the R2 lake, rebuild the warehouse, and upload it to R2. The data
# report stays CI-only (ci.yml), built from CI's own fixture/fixed-day data, not run here.
# `workflow_dispatch` also allows a manual run, with optional --start/--end for a backfill,
# from the GitHub UI.
on:
  schedule:
    # 2 AM UTC, after US games end and before US morning. Runs year-round; off-season
    # days load zero games (the pipelines already skip dates outside the season).
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start date (YYYY-MM-DD). Leave empty to catch up from the watermark."
        required: false
      end:
        description: "Backfill end date (YYYY-MM-DD). Required if start is set."
        required: false

concurrency:
  # One run at a time: a manual dispatch overlapping the next cron firing (or a long
  # backfill running past the next day's trigger) would race on the same R2 watermark.
  group: scheduled-ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  DBT_OUTPUT_MODE: production

jobs:
  scheduled-ingest:
    name: Ingest + dbt + upload (production)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET_URL: ${{ vars.S3_BUCKET_URL }}
        run: |
          # Values come from the environment, never interpolated into a shell command, so a
          # key or URL with regex-special characters can't corrupt the substitution.
          python3 - <<'PYEOF'
          import os
          import re
          from pathlib import Path

          overrides = {
              "UID": str(os.getuid()),
              "GID": str(os.getgid()),
              "AWS_ACCESS_KEY_ID": os.environ["AWS_ACCESS_KEY_ID"],
              "AWS_SECRET_ACCESS_KEY": os.environ["AWS_SECRET_ACCESS_KEY"],
              "S3_BUCKET_URL": os.environ["S3_BUCKET_URL"],
              "IS_PROD": "true",
          }
          text = Path(".env.example").read_text()
          for key, value in overrides.items():
              text = re.sub(rf"(?m)^{key}=.*$", f"{key}={value}", text)
          Path(".env").write_text(text)
          PYEOF
          mkdir -p data

      - name: Build image
        run: docker compose build

      - name: Ingest Statcast
        env:
          BACKFILL_START: ${{ inputs.start }}
          BACKFILL_END: ${{ inputs.end }}
        run: |
          args=()
          if [ -n "$BACKFILL_START" ]; then args+=(--start "$BACKFILL_START" --end "$BACKFILL_END"); fi
          docker compose run --rm pipeline python -m mlb.pipelines.statcast "${args[@]}"

      - name: Ingest MLB Stats API
        env:
          BACKFILL_START: ${{ inputs.start }}
          BACKFILL_END: ${{ inputs.end }}
        run: |
          args=()
          if [ -n "$BACKFILL_START" ]; then args+=(--start "$BACKFILL_START" --end "$BACKFILL_END"); fi
          docker compose run --rm pipeline python -m mlb.pipelines.mlb_api "${args[@]}"

      - name: dbt build
        run: docker compose run --rm dbt build

      # P2M1's design (docs/roadmap/phase-2-cloud-and-scale.md): DuckDB has no server mode to
      # write to remotely, so dbt builds the warehouse to a local file even in prod, rebuilt
      # from the R2 lake every run (principle 2, the warehouse is disposable). Upload it as a
      # single object so it persists past this ephemeral runner, for any consumer that needs
      # the built warehouse (e.g. a future report build), without needing R2 read access itself.
      - name: Upload warehouse to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET_URL: ${{ vars.S3_BUCKET_URL }}
        run: |
          read -r BUCKET_PATH ENDPOINT_URL <<<"$(python3 -c "
          import os
          from urllib.parse import urlsplit
          parts = urlsplit(os.environ['S3_BUCKET_URL'])
          print(parts.path.strip('/'), f'https://{parts.netloc}')
          ")"
          aws s3 cp data/warehouse/mlb.duckdb "s3://$BUCKET_PATH/mlb.duckdb" \
            --endpoint-url "$ENDPOINT_URL"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-ingest-logs
          path: |
            data/logs/
            dbt/logs/
          if-no-files-found: ignore
