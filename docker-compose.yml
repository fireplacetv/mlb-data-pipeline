x-mlb-base: &mlb-base
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: mlb-pipeline:dev
  env_file: .env
  environment:
    MLB_DATA_DIR: /data
    DBT_PROFILES_DIR: /app/dbt
    DBT_PROJECT_DIR: /app/dbt
    TZ: America/Los_Angeles
    USER: ${USER:-dev}
  volumes:
    - .:/app
    - ./data:/data

services:
  pipeline:
    <<: *mlb-base

  dbt:
    <<: *mlb-base
    working_dir: /app/dbt
    # DuckDB won't create a missing folder, so make data/warehouse first (it may have been
    # deleted to rebuild from the lake), then hand the arguments to dbt.
    entrypoint: ["sh", "-c", 'mkdir -p "$$MLB_DATA_DIR/warehouse" && exec dbt "$$@"', "dbt"]
    command: ["build"]

  # Rill Developer over a downloaded copy of the production warehouse (P1M1,
  # docs/roadmap/phase-1-modeling-layer.md). Local-only development aid: not built, published,
  # or deployed in CI. Run `docker compose run --rm pipeline python -m mlb.explore` first to
  # create data/explore/mlb.duckdb (needs R2 settings in .env); explore/connectors/duckdb.yaml
  # then attaches it read-only. UI at http://localhost:9009. Image tag unverified against
  # Rill's current release in this change (no network access to check it when this was
  # written; see the P1M1 decision log entry in docs/roadmap/phase-1-modeling-layer.md) --
  # bump it if `docker compose up explore` can't find it.
  explore:
    image: rilldata/rill:v0.83.8
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/explore
    environment:
      HOME: /tmp
    volumes:
      - .:/app
      - ./data:/data
    ports:
      - "9009:9009"
    command: ["start"]

  # Evidence report over the warehouse (reports/). Node, not the Python image; reads
  # data/warehouse/mlb.duckdb read-only through the repo mount.
  reports:
    image: node:22-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/reports
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      SEND_ANONYMOUS_USAGE_STATS: "no"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    entrypoint: ["npm"]
    command: ["run", "build"]
