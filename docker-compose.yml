x-mlb-base: &mlb-base
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: mlb-pipeline:dev
  env_file: .env
  environment:
    MLB_DATA_DIR: /data
    DBT_PROFILES_DIR: /app/dbt
    DBT_PROJECT_DIR: /app/dbt
    TZ: America/Los_Angeles
    USER: ${USER:-dev}
    # Lake destination (docs/configuration.md). Listed here, not only read from .env, so a
    # value exported in the shell (GitHub Actions secrets) reaches the container too.
    BUCKET_URL: ${BUCKET_URL:-}
    IS_PROD: ${IS_PROD:-false}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  volumes:
    - .:/app
    - ./data:/data

services:
  pipeline:
    <<: *mlb-base

  dbt:
    <<: *mlb-base
    working_dir: /app/dbt
    # DuckDB won't create a missing folder, so make data/warehouse first (it may have been
    # deleted to rebuild from the lake), then hand the arguments to dbt.
    entrypoint: ["sh", "-c", 'mkdir -p "$$MLB_DATA_DIR/warehouse" && exec dbt "$$@"', "dbt"]
    command: ["build"]

  # Evidence report over the warehouse (reports/). Node, not the Python image; reads
  # data/warehouse/mlb.duckdb read-only through the repo mount.
  reports:
    image: node:22-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/reports
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      SEND_ANONYMOUS_USAGE_STATS: "no"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    entrypoint: ["npm"]
    command: ["run", "build"]
