# Evidence (open-source, static build) settings. CI appends a deployment.basePath so the
# site works under its GitHub Pages path; locally the site is served from /.
appearance:
  default: system
  switcher: true

theme:
  # Evidence's default series colors are four similar blues that fail colorblind and contrast
  # checks. This order is validated for adjacent series; scatter charts use at most the first
  # three, which also validate against each other.
  colorPalettes:
    default:
      light:
        - "#2a78d6"
        - "#eb6834"
        - "#1baf7a"
        - "#eda100"
        - "#e87ba4"
        - "#008300"
        - "#4a3aa7"
        - "#e34948"
      dark:
        - "#3987e5"
        - "#d95926"
        - "#199e70"
        - "#c98500"
        - "#d55181"
        - "#008300"
        - "#9085e9"
        - "#e66767"

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}
